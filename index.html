<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangout</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    .content {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
    }

    h1 {
        color: #222;
        font-size: 42px;
        margin: 0;
    }

    /* Botão circular */
    .fab {
        position: fixed;
        right: 24px;
        bottom: 24px;

        width: 60px;
        height: 60px;

        border-radius: 50%;
        border: none;

        background: #4CAF50;
        color: white;

        font-size: 36px;
        line-height: 60px;

        text-align: center;

        box-shadow: 0 4px 10px rgba(0,0,0,0.3);

        cursor: pointer;
    }

    .fab:active {
        transform: scale(0.95);
    }
</style>
</head>

<body>

<div class="content">
    
</div>

<button class="fab">+</button>

</body>
</html>
