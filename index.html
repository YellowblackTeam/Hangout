<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangout</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

#loginScreen {
    padding: 20px;
    text-align: center;
    margin-top: 40px;
}

#nameInput {
    width: 80%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 18px;
}

#continueBtn {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 18px;
}

#rooms {
    display: none;
    padding: 15px;
}

.room {
    background: white;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    cursor: pointer;
    font-size: 20px;
}

.room:hover {
    background: #eeeeee;
}

#chatScreen {
    display: none;
}

#messages {
    padding: 10px;
    padding-bottom: 100px;
}

.message {
    background: white;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

.name {
    font-weight: bold;
    color: #4CAF50;
    font-size: 22px;
}

.deleteBtn {
    background: #ff4444;
    color: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
}

#bottomBar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #f2f2f2;
    padding: 10px;
    display: flex;
    gap: 10px;
    box-sizing: border-box;
}

#messageInput {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 18px;
}

#sendBtn {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 18px;
}

</style>
</head>
<body>

<!-- LOGIN -->

<div id="loginScreen">

    <h1>Hangout</h1>

    <input
        type="text"
        id="nameInput"
        placeholder="Seu nome">

    <br><br>

    <button
        id="continueBtn"
        onclick="continueApp()">

        Continuar

    </button>

</div>

<!-- ROOMS -->

<div id="rooms">

    <div class="room" onclick="enterRoom('Room1')">
        Room 1
    </div>

    <div class="room" onclick="enterRoom('Room2')">
        Room 2
    </div>

    <div class="room" onclick="enterRoom('Room3')">
        Room 3
    </div>

</div>

<!-- CHAT -->

<div id="chatScreen">

    <div id="messages"></div>

    <div id="bottomBar">

        <input
            type="text"
            id="messageInput"
            placeholder="Mensagem...">

        <button id="sendBtn">
            Enviar
        </button>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyCawUJWCCQNq3tCkNLDTZeI2BYhusxvRUM",

  authDomain: "hangout-966e7.firebaseapp.com",

  databaseURL:
  "https://hangout-966e7-default-rtdb.firebaseio.com",

  projectId: "hangout-966e7",

  storageBucket:
  "hangout-966e7.firebasestorage.app",

  messagingSenderId: "845219164699",

  appId:
  "1:845219164699:web:13885326b0414c42747ebe",

  measurementId: "G-3NY006BE55"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let username = "";

let currentRoom = "";

window.continueApp = function() {

    const input =
    document.getElementById("nameInput");

    username = input.value.trim();

    if(username === "") {

        alert("Digite um nome");

        return;
    }

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "rooms"
    ).style.display = "block";
};

window.enterRoom = function(roomName) {

    currentRoom = roomName;

    document.getElementById(
        "rooms"
    ).style.display = "none";

    document.getElementById(
        "chatScreen"
    ).style.display = "block";

    const messagesDiv =
    document.getElementById("messages");

    messagesDiv.innerHTML = "";

    const roomRef =
    ref(db, "rooms/" + roomName);

    onChildAdded(roomRef, function(snapshot) {

        const data = snapshot.val();

        const msg =
        document.createElement("div");

        msg.className = "message";

        const msgId = snapshot.key;

        msg.innerHTML =

            "<div style='display:flex; justify-content:space-between; align-items:center;'>"

            +

            "<div class='name'>" +
            data.name +
            "</div>"

            +

            (
                data.name === username
                ?

                "<button class='deleteBtn' id='delete-" + msgId + "'>X</button>"

                :

                ""
            )

            +

            "</div>"

            +

            "<div style='margin-top:8px; font-size:20px;'>" +
            data.message +
            "</div>";

        messagesDiv.appendChild(msg);

        if(data.name === username) {

            const realDeleteBtn =
            document.getElementById(
                "delete-" + msgId
            );

            realDeleteBtn.onclick = function() {

                remove(
                    ref(
                        db,
                        "rooms/" +
                        currentRoom +
                        "/" +
                        msgId
                    )
                );

                msg.remove();
            };
        }

        messagesDiv.scrollTop =
        messagesDiv.scrollHeight;
    });
};

const sendBtn =
document.getElementById("sendBtn");

sendBtn.addEventListener(
    "click",
    function() {

        const input =
        document.getElementById(
            "messageInput"
        );

        const text =
        input.value.trim();

        if(text === "") return;

        const roomRef =
        ref(
            db,
            "rooms/" + currentRoom
        );

        push(roomRef, {

            name: username,

            message: text

        });

        input.value = "";
    }
);

</script>

</body>
</html>
